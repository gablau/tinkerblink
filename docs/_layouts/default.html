<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  {% seo %}
  <link rel="icon" type="image/png" href="{{ '/assets/icon.png' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
</head>
<body>
  <header class="top">
    <div class="wrap top-row">
      <a class="brand" href="{{ '/' | relative_url }}">
        <img src="{{ '/assets/icon.png' | relative_url }}" alt="" width="36" height="36">
        <span>TinkerBlink</span>
      </a>
      <nav>
        <a href="{{ '/privacy' | relative_url }}">Privacy</a>
        <a href="https://github.com/gablau/tinkerblink">GitHub</a>
      </nav>
    </div>
  </header>
  <main class="wrap content">
    {{ content }}
  </main>
  <footer class="wrap foot">
    <p>TinkerBlink is free software (GPL-3.0 or later) by Gabriele Lauricella. It is an independent project, not
      affiliated with or endorsed by Blynk Inc.</p>
  </footer>
</body>
</html>
