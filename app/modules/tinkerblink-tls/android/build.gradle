plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'app.tinkerblink.tls'
version = '0.1.0'

android {
  namespace "app.tinkerblink.tls"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // WebSocketModule / NetworkingModule hooks and OkHttp (an api dependency of react-android)
  implementation 'com.facebook.react:react-android'
}
